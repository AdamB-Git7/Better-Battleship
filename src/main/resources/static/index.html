<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battleship 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js is stored in /vendor, so the game needs no internet access. -->
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/three.module.min.js",
                "three/addons/": "./vendor/three/addons/"
            }
        }
    </script>
    <script src="vendor/stomp/stomp.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
<!-- The 3D scene fills the page; the interface below floats on top of it. -->
<canvas id="scene"></canvas>

<div id="hud">
    <header class="topbar">
        <div class="brand">BATTLESHIP <span>3D</span></div>
        <div id="turn" class="turn" hidden></div>
        <div class="topbar-right">
            <span id="connection" class="muted">Connecting…</span>
            <button id="view" class="icon" title="Switch between the bridge and the aerial view (V)" hidden>AERIAL VIEW (V)</button>
            <button id="guide" class="icon" title="Pirate guide on / off" aria-label="Pirate guide on / off">GUIDE ON</button>
            <button id="mute" class="icon" title="Sound on / off" aria-label="Sound on / off">SOUND ON</button>
        </div>
    </header>

    <section id="lobby" class="panel lobby">
        <h1>Naval Command</h1>
        <p class="muted">Create a room and share its code, or join a friend's room.</p>
        <button id="create" disabled>Create room</button>
        <div class="join">
            <input id="code" placeholder="ROOM CODE" maxlength="6" autocomplete="off" aria-label="Room code">
            <button id="join" disabled>Join</button>
        </div>
        <p id="notice" class="notice" hidden></p>
    </section>

    <aside id="fleets" class="panel fleets" hidden>
        <div class="fleet">
            <span class="label">Your fleet</span>
            <span id="your-pips" class="pips"></span>
            <span id="your-count" class="count"></span>
        </div>
        <div class="fleet enemy">
            <span class="label">Enemy fleet</span>
            <span id="enemy-pips" class="pips"></span>
            <span id="enemy-count" class="count"></span>
        </div>
    </aside>

    <section id="room" class="panel room" hidden>
        <p class="room-line">ROOM <strong id="room-code"></strong> · <span id="room-players"></span>/2 players</p>
        <p id="status" class="status"></p>
        <p id="error" class="error" hidden></p>
        <div class="actions">
            <button id="rotate" hidden>Rotate (R)</button>
            <button id="rematch" hidden>Rematch</button>
            <button id="leave" class="secondary">Leave</button>
        </div>
    </section>

    <div id="banner" class="banner" hidden></div>

    <!-- The pirate guide (block 2). His lines are in js/game/guide.js. -->
    <aside id="pirate" class="pirate" hidden>
        <div id="pirate-bubble" class="panel pirate-bubble" hidden title="Click to skip or close">
            <span class="pirate-name">Rusty · first mate</span>
            <p id="pirate-text" aria-hidden="true"></p>
            <p id="pirate-live" class="sr-only" aria-live="polite"></p>
        </div>
        <button id="pirate-portrait" class="pirate-portrait" title="Repeat the last line"
                aria-label="Pirate guide: repeat the last line">
            <svg viewBox="0 0 120 124" aria-hidden="true">
                <!-- coat -->
                <path d="M10 124 C12 96 34 86 60 86 C86 86 108 96 110 124 Z" fill="#1f2f45"/>
                <path d="M60 86 L46 124 M60 86 L74 124" stroke="#d9a441" stroke-width="3" fill="none"/>
                <path d="M48 88 L60 104 L72 88 Z" fill="#e9e2d0"/>
                <!-- head -->
                <ellipse cx="60" cy="62" rx="27" ry="29" fill="#d9a074"/>
                <circle cx="33" cy="66" r="5" fill="#d9a074"/>
                <circle cx="31" cy="73" r="3.2" fill="none" stroke="#f0c040" stroke-width="2"/>
                <!-- beard -->
                <path d="M33 64 C33 96 46 104 60 104 C74 104 87 96 87 64 C82 78 72 80 60 80 C48 80 38 78 33 64 Z"
                      fill="#6b3f23"/>
                <path d="M44 76 C50 71 56 73 60 76 C64 73 70 71 76 76 C70 80 64 79 60 78 C56 79 50 80 44 76 Z"
                      fill="#4f2d18"/>
                <!-- mouth (opens and closes while he talks) -->
                <ellipse class="pirate-mouth" cx="60" cy="85" rx="7" ry="2.2" fill="#2a1410"/>
                <!-- nose -->
                <path d="M60 60 C56 68 57 72 62 72" stroke="#b97f55" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <!-- good eye (blinks) -->
                <g class="pirate-eye">
                    <ellipse cx="72" cy="58" rx="6" ry="5" fill="#fff"/>
                    <circle cx="73" cy="58.5" r="2.6" fill="#1b1b1b"/>
                </g>
                <path d="M65 50 L80 48" stroke="#4f2d18" stroke-width="3" stroke-linecap="round"/>
                <!-- eye patch -->
                <path d="M34 44 L88 52" stroke="#111" stroke-width="2.5"/>
                <ellipse cx="48" cy="58" rx="8" ry="7" fill="#111"/>
                <!-- bandana -->
                <path d="M32 50 C36 34 84 34 88 50 C70 42 50 42 32 50 Z" fill="#b3261e"/>
                <!-- hat -->
                <path d="M14 44 C30 30 42 10 60 10 C78 10 90 30 106 44 C88 36 74 34 60 34 C46 34 32 36 14 44 Z"
                      fill="#1b1f27"/>
                <path d="M14 44 C32 36 46 34 60 34 C74 34 88 36 106 44" stroke="#d9a441" stroke-width="3" fill="none"
                      stroke-linecap="round"/>
                <circle cx="60" cy="22" r="5" fill="#e9e2d0"/>
                <path d="M53 29 L67 17 M53 17 L67 29" stroke="#e9e2d0" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
        </button>
    </aside>
</div>

<div id="loading" class="loading">
    <div class="loading-box">
        <div class="brand">BATTLESHIP <span>3D</span></div>
        <div class="bar"><div id="loading-bar"></div></div>
        <p id="loading-text" class="muted">Loading the sea…</p>
    </div>
</div>
</body>
</html>
