<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battleship 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js is stored in /vendor, so the game needs no internet access. -->
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/three.module.min.js",
                "three/addons/": "./vendor/three/addons/"
            }
        }
    </script>
    <script src="vendor/stomp/stomp.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
<!-- The 3D scene fills the page; the interface below floats on top of it. -->
<canvas id="scene"></canvas>

<div id="hud">
    <header class="topbar">
        <div class="brand">BATTLESHIP <span>3D</span></div>
        <div id="turn" class="turn" hidden></div>
        <div class="topbar-right">
            <span id="connection" class="muted">Connecting…</span>
            <button id="mute" class="icon" title="Sound on / off" aria-label="Sound on / off">SOUND ON</button>
        </div>
    </header>

    <section id="lobby" class="panel lobby">
        <h1>Naval Command</h1>
        <p class="muted">Create a room and share its code, or join a friend's room.</p>
        <button id="create" disabled>Create room</button>
        <div class="join">
            <input id="code" placeholder="ROOM CODE" maxlength="6" autocomplete="off" aria-label="Room code">
            <button id="join" disabled>Join</button>
        </div>
        <p id="notice" class="notice" hidden></p>
    </section>

    <aside id="fleets" class="panel fleets" hidden>
        <div class="fleet">
            <span class="label">Your fleet</span>
            <span id="your-pips" class="pips"></span>
            <span id="your-count" class="count"></span>
        </div>
        <div class="fleet enemy">
            <span class="label">Enemy fleet</span>
            <span id="enemy-pips" class="pips"></span>
            <span id="enemy-count" class="count"></span>
        </div>
    </aside>

    <section id="room" class="panel room" hidden>
        <p class="room-line">ROOM <strong id="room-code"></strong> · <span id="room-players"></span>/2 players</p>
        <p id="status" class="status"></p>
        <p id="error" class="error" hidden></p>
        <div class="actions">
            <button id="rotate" hidden>Rotate (R)</button>
            <button id="rematch" hidden>Rematch</button>
            <button id="leave" class="secondary">Leave</button>
        </div>
    </section>

    <div id="banner" class="banner" hidden></div>
</div>

<div id="loading" class="loading">
    <div class="loading-box">
        <div class="brand">BATTLESHIP <span>3D</span></div>
        <div class="bar"><div id="loading-bar"></div></div>
        <p id="loading-text" class="muted">Loading the sea…</p>
    </div>
</div>
</body>
</html>
